<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">

<title>Հայաստանում վերավաճառք</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Noto+Sans+Armenian:wght@600;700;800&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f2; --panel:#ffffff; --panel2:#eef0ea; --ink:#17201a; --muted:#5c6a60;
  --line:#dde2d8; --green:#177245; --green-bg:#e3f2e7; --red:#b3372c; --red-bg:#fbe9e6;
  --blue:#1d5fa8; --blue-bg:#e6effa; --shadow:0 1px 3px rgba(20,30,20,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121613; --panel:#1b211c; --panel2:#232a24; --ink:#e8ede8; --muted:#9fb0a2;
    --line:#2e3830; --green:#4cc07e; --green-bg:#173325; --red:#f08a7d; --red-bg:#3a201c;
    --blue:#7db3ec; --blue-bg:#1c2c42; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope","Noto Sans Armenian",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
.wrap{max-width:1080px;margin:0 auto;padding:16px 14px 260px}
.mono{font-family:"IBM Plex Mono",monospace}
h1{font-size:22px;margin:0 0 12px;font-weight:800;letter-spacing:-.01em}
.totals{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.tcell{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:9px 14px;display:flex;align-items:baseline;gap:10px}
.tcell .tl{font-size:12.5px;font-weight:800;letter-spacing:.04em;color:var(--muted)}
.tcell .tv{font-family:"IBM Plex Mono",monospace;font-size:18px;font-weight:700}
.tcell .tv.good{color:var(--green)}
.layout{display:flex;gap:16px;align-items:flex-start}
.content{flex:1;min-width:0}
.catpanel{width:190px;flex-shrink:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px;position:sticky;top:16px}
.catpanel h2{font-size:13px;font-weight:800;letter-spacing:.04em;color:var(--muted);margin:0 0 8px;text-transform:uppercase}
.catlist{display:flex;flex-direction:column;gap:4px}
.catbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:transparent;color:var(--ink);border-radius:9px;padding:10px 11px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;min-height:44px}
.catbtn:hover{background:var(--panel2)}
.catbtn.on{background:var(--ink);color:var(--bg)}
.catbtn .cnt{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:13px;color:var(--muted)}
.catbtn.on .cnt{color:var(--bg);opacity:.75}
@media(max-width:720px){
  .layout{flex-direction:column}
  .catpanel{width:100%;position:static}
  .catlist{flex-direction:row;flex-wrap:wrap}
  .catbtn{width:auto;flex:1 1 auto}
  .basket{position:static;box-shadow:none}
  .wrap{padding-bottom:24px}
}

/* Filters + sort */
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.pill{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:10px 15px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;min-height:44px}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill .cnt{font-family:"IBM Plex Mono",monospace;font-weight:700}
.sortlab{font-size:12.5px;font-weight:800;color:var(--muted);margin-left:2px}
.undobtn{margin-left:auto;width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:18px;cursor:pointer;font-family:inherit}
.undobtn:disabled{opacity:.35;cursor:default}

/* Rows */
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px}
.row.removed{opacity:.75}
.top{display:flex;align-items:flex-start;gap:12px}
.thumbwrap{position:relative;width:64px;height:64px;flex-shrink:0;border-radius:10px;border:1px solid var(--line);background:var(--panel2);overflow:hidden}
.thumbwrap svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:26px;height:26px;stroke:var(--muted);opacity:.5}
.thumbwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff;opacity:0;transition:opacity .15s}
.thumbwrap img.ok{opacity:1}
.main{flex:1;min-width:0}
.name{font-size:16px;font-weight:800;line-height:1.25;margin:0}
.prices{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:5px;font-size:13.5px;color:var(--muted);font-weight:600}
.prices .val{font-family:"IBM Plex Mono",monospace;font-weight:700;color:var(--ink)}
.prices .usd{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;color:var(--muted)}
.profit{font-family:"IBM Plex Mono",monospace;font-size:30px;font-weight:700;line-height:1;white-space:nowrap;text-align:right}
.profit.pos{color:var(--green)} .profit.neg{color:var(--red)}
.profit small{display:block;font-family:"Manrope","Noto Sans Armenian",sans-serif;font-size:11px;font-weight:700;color:var(--muted);margin-top:4px;letter-spacing:.04em}
.badge{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:800;line-height:1;padding:5px 8px;border-radius:999px;letter-spacing:.01em}
.badge.high{background:var(--green-bg);color:var(--green)}
.badge.medium{background:var(--blue-bg);color:var(--blue)}
.badge.low{background:var(--red-bg);color:var(--red)}
.badge.good{background:var(--green-bg);color:var(--green)}
.badge.maybe{background:var(--blue-bg);color:var(--blue)}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.links a{font-size:13px;font-weight:800;text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:8px 11px;color:var(--ink);background:var(--panel);min-height:38px;display:inline-flex;align-items:center}
.links a.us{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.links .nolink{font-size:13px;font-weight:700;color:var(--muted);border:1px dashed var(--line);border-radius:9px;padding:8px 11px;min-height:38px;display:inline-flex;align-items:center}
.actions{display:flex;gap:6px;align-items:stretch;margin-top:10px}
.mbtn{flex:1;min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);font-size:14.5px;font-weight:800;cursor:pointer;font-family:inherit;padding:8px 4px}
.mbtn:active{transform:translateY(1px)}
.mbtn.on-like{background:var(--green);border-color:var(--green);color:#fff}
.mbtn.btn-like{background:#1a7f37;border-color:#1a7f37;color:#fff}
.mbtn.btn-remove{background:#cf222e;border-color:#cf222e;color:#fff}
.mbtn.on-later{background:var(--blue);border-color:var(--blue);color:#fff}
.mbtn.on-removed{background:var(--red);border-color:var(--red);color:#fff}
@media (prefers-color-scheme: dark){.mbtn.on-like,.mbtn.on-later,.mbtn.on-removed{color:#101511}}
.qty{display:flex;align-items:center;gap:2px;margin-left:4px}
.qty button{width:44px;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:19px;font-weight:800;cursor:pointer;font-family:inherit}
.qty .n{font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:700;min-width:24px;text-align:center}
@media(max-width:520px){
  .thumbwrap{width:54px;height:54px}
  .profit{font-size:25px}
  .actions{flex-wrap:wrap}
  .qty{margin-left:auto}
}

/* Basket */
.basket{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -2px 10px rgba(0,0,0,.08);z-index:40}
.basket .in{max-width:1080px;margin:0 auto;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.basket .t{font-size:15px;font-weight:800}
.basket .cell .l{font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.basket .cell .v{font-family:"IBM Plex Mono",monospace;font-size:18px;font-weight:700}
.basket .cell.profitv .v{color:var(--green)}
.basket .cell .s{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;color:var(--muted)}
@media(max-width:720px){.basket{position:static;box-shadow:none}}
.note{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:6px;line-height:1.35}
.empty{text-align:center;color:var(--muted);padding:32px 10px;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:92vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>

var qty = {};
var marks = {};
var undoStack = [];
PRODUCTS.forEach(function(p){ qty[p.id]=0; });
qty["hrm200"]=2; qty["hrm600"]=1; qty["avent17"]=1;
qty["beatspro"]=2; qty["psportal"]=1; qty["instax13"]=2; qty["instaxevo"]=1; qty["instaxliplay"]=1; qty["airtag4"]=2; qty["nbiron"]=2; qty["nbglucosamine"]=2;
qty["airpods4nc"]=2; qty["nblysine"]=2; qty["solgarcmz"]=2; qty["instaxse"]=1;
qty["natrolD3"]=2; qty["solgarZinc"]=2; qty["solgarIron"]=2; qty["solgarMgCitrate"]=1; qty["solgarVitC"]=1; qty["solgarCaMgD3"]=2;
qty["vsmistlove"]=5;
var state = {sort:"profit", markf:"all", cat:"all", demand:"all"};

function taxPrice(p){ return p.usPrice*TAX; }
function armUSD(p){ return p.armAMD/RATE; }
function profit(p){ return armUSD(p)-taxPrice(p); }
function money(n){ var s = n<0?"-$":"$"; return s + Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function money0(n){ var s = n<0?"-$":"$"; return s + Math.abs(Math.round(n)).toLocaleString("en-US"); }
function amd(n){ return n.toLocaleString("en-US")+" դրամ"; }
function usAMD(p){ return Math.round(Math.round(taxPrice(p)*100)/100*RATE); }
function profitAMD(p){ return (typeof p.profitAMD==="number") ? p.profitAMD : Math.round(profit(p))*RATE; }
function amd0(n){ var s = n<0?"-":""; return s + Math.abs(Math.round(n)).toLocaleString("en-US")+" դրամ"; }

var toastTimer = null;
function showToast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1600);
}
function syncUndoBtn(){ document.getElementById("undoBtn").disabled = !undoStack.length; }
function setMark(id, m){
  var cur = marks[id] || null;
  undoStack.push({id:id, prev:cur});
  if(cur === m) delete marks[id]; else marks[id] = m;
  syncUndoBtn();
  render();
}
function undoLast(){
  var last = undoStack.pop();
  if(!last) return;
  if(last.prev) marks[last.id] = last.prev; else delete marks[last.id];
  syncUndoBtn();
  render();
}

function emptyMsg(){
  if(state.demand!=="all") return "Այդ պահանջարկով ապրանք չկա։";
  if(state.markf==="like") return "Դեռ ոչինչ չեք հավանել։";
  if(state.markf==="later") return "«Հետո» նշվածներ չկան։";
  if(state.markf==="removed") return "Հեռացրածներ չկան։";
  return "Դատարկ է։";
}

function render(){
  var cLike=0, cLater=0, cRem=0;
  PRODUCTS.forEach(function(p){
    var m = marks[p.id];
    if(m==="like") cLike++; else if(m==="later") cLater++; else if(m==="removed") cRem++;
  });
  document.getElementById("cntLike").textContent = cLike;
  document.getElementById("cntLater").textContent = cLater;
  document.getElementById("cntRem").textContent = cRem;
  var cHigh=0, cMed=0, cLow=0;
  PRODUCTS.forEach(function(p){ if(p.demand==="high") cHigh++; else if(p.demand==="medium") cMed++; else if(p.demand==="low") cLow++; });
  document.getElementById("cntHigh").textContent = cHigh;
  document.getElementById("cntMed").textContent = cMed;
  document.getElementById("cntLow").textContent = cLow;

  var catCounts = {};
  PRODUCTS.forEach(function(p){ catCounts[p.cat] = (catCounts[p.cat]||0)+1; });
  var catKeys = Object.keys(CATS).filter(function(k){ return catCounts[k]; });
  PRODUCTS.forEach(function(p){ if(catKeys.indexOf(p.cat)<0 && catCounts[p.cat]) catKeys.push(p.cat); });
  var catHtml = '<button type="button" class="catbtn'+(state.cat==="all"?" on":"")+'" data-cat="all"><span>Բոլորը</span><span class="cnt">'+PRODUCTS.length+'</span></button>';
  catKeys.forEach(function(k){
    catHtml += '<button type="button" class="catbtn'+(state.cat===k?" on":"")+'" data-cat="'+k+'"><span>'+(CATS[k]||k)+'</span><span class="cnt">'+catCounts[k]+'</span></button>';
  });
  document.getElementById("catList").innerHTML = catHtml;
  document.querySelectorAll("[data-cat]").forEach(function(b){ b.addEventListener("click", function(){ state.cat = b.getAttribute("data-cat"); render(); }); });

  var list = PRODUCTS.filter(function(p){
    if(state.cat!=="all" && p.cat!==state.cat) return false;
    if(state.demand!=="all" && p.demand!==state.demand) return false;
    var mk = marks[p.id] || null;
    if(state.markf==="all"){ if(mk==="removed") return false; }
    else if(mk!==state.markf) return false;
    return true;
  });
  list.sort(function(a,b){
    if(state.sort==="profit") return profit(b)-profit(a);
    if(state.sort==="us") return taxPrice(a)-taxPrice(b);
    return a.name.localeCompare(b.name);
  });

  var html = "";
  if(!list.length){ html = '<div class="empty">'+emptyMsg()+'</div>'; }
  list.forEach(function(p){
    var pr = profit(p), tp = taxPrice(p), prA = profitAMD(p);
    var mk = marks[p.id] || null;
    var usBtn = p.usLink ? '<a class="us" href="'+p.usLink+'" target="_blank" rel="noopener">ԱՄՆ ↗</a>' : '<span class="nolink">Հղում չկա</span>';
    var armBtn = p.armLink ? '<a href="'+p.armLink+'" target="_blank" rel="noopener">Հայաստան ↗</a>' : '<span class="nolink">Հղում չկա</span>';
    var imgFile = IMG[p.id];
    var thumbHtml = '<span class="thumbwrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-9 9"/></svg>'
      + (imgFile ? '<img class="thumb" src="assets/'+imgFile+'" alt="" loading="lazy">' : '')
      + '</span>';
    html += '<article class="row'+(mk==="removed"?' removed':'')+'">'
      + '<div class="top">'+thumbHtml+'<div class="main">'
      + '<h2 class="name">'+p.name+'</h2>'
      + '<span class="badge '+p.demand+'">'+DEMAND[p.demand]+'</span>'
      + (p.status ? ' <span class="badge '+(STATUS_CLASS[p.status]||'')+'">'+p.status+'</span>' : '')
      + '</div>'
      + '<div class="profit '+(pr>=0?'pos':'neg')+'">'+amd0(prA)+'<small>ՇԱՀՈՒՅԹ · '+((typeof p.profitAMD==="number")?money(pr):money0(pr))+'</small></div>'
      + '</div>'
      + '<div class="prices"><span>ԱՄՆ հարկով՝ <span class="val">'+amd(usAMD(p))+'</span> <span class="usd">'+money(tp)+'</span></span><span>Հայաստան՝ <span class="val">'+amd(p.armAMD)+'</span> <span class="usd">'+money(armUSD(p))+'</span></span></div>'
      + (p.note ? '<div class="note">'+p.note+'</div>' : '')
      + '<div class="links">'+usBtn+armBtn+'</div>'
      + '<div class="actions">'
      + '<button type="button" class="mbtn btn-like'+(mk==="like"?" on-like":"")+'" data-mark="like" data-id="'+p.id+'">✓ Հավանել</button>'
      + '<button type="button" class="mbtn'+(mk==="later"?" on-later":"")+'" data-mark="later" data-id="'+p.id+'">Հետո</button>'
      + '<button type="button" class="mbtn btn-remove'+(mk==="removed"?" on-removed":"")+'" data-mark="removed" data-id="'+p.id+'">✕ Հեռացնել</button>'
      + '<span class="qty"><button type="button" data-dec="'+p.id+'" aria-label="Հանել մեկ հատ">−</button><span class="n" id="n-'+p.id+'">'+qty[p.id]+'</span><button type="button" data-inc="'+p.id+'" aria-label="Ավելացնել մեկ հատ">+</button></span>'
      + '</div></article>';
  });
  document.getElementById("list").innerHTML = html;
  document.querySelectorAll("img.thumb").forEach(function(im){
    function show(){ im.classList.add("ok"); }
    function fail(){ if(im.parentNode) im.parentNode.removeChild(im); }
    if(im.complete){ if(im.naturalWidth>0) show(); else fail(); }
    else { im.addEventListener("load", show); im.addEventListener("error", fail); }
  });
  document.querySelectorAll("[data-inc]").forEach(function(b){ b.addEventListener("click", function(){ qty[b.getAttribute("data-inc")]++; syncQty(); }); });
  document.querySelectorAll("[data-dec]").forEach(function(b){ b.addEventListener("click", function(){ var id=b.getAttribute("data-dec"); if(qty[id]>0) qty[id]--; syncQty(); }); });
  document.querySelectorAll("[data-mark]").forEach(function(b){ b.addEventListener("click", function(){ setMark(b.getAttribute("data-id"), b.getAttribute("data-mark")); }); });
  syncQty();
}

function syncQty(){
  var units=0, cost=0, prof=0, costA=0, profA=0;
  PRODUCTS.forEach(function(p){
    var n = qty[p.id]||0;
    units+=n; cost+=n*taxPrice(p); prof+=n*profit(p); costA+=n*usAMD(p); profA+=n*profitAMD(p);
    var el=document.getElementById("n-"+p.id); if(el) el.textContent=n;
  });
  document.getElementById("bUnits").textContent = units;
  document.getElementById("bCost").textContent = amd0(costA);
  document.getElementById("bCostUsd").textContent = money0(cost);
  document.getElementById("bProfit").textContent = amd0(profA);
  document.getElementById("bProfitUsd").textContent = money0(prof);
}

document.getElementById("markPills").addEventListener("click", function(e){
  var btn = e.target.closest ? e.target.closest("button") : null;
  if(!btn) return;
  state.markf = btn.getAttribute("data-markf");
  this.querySelectorAll(".pill").forEach(function(x){ x.classList.toggle("on", x===btn); });
  render();
});
document.getElementById("sortPills").addEventListener("click", function(e){
  var btn = e.target.closest ? e.target.closest("button") : null;
  if(!btn) return;
  state.sort = btn.getAttribute("data-sort");
  this.querySelectorAll(".pill").forEach(function(x){ x.classList.toggle("on", x===btn); });
  render();
});
document.getElementById("demandPills").addEventListener("click", function(e){
  var btn = e.target.closest ? e.target.closest("button") : null;
  if(!btn) return;
  state.demand = btn.getAttribute("data-demand");
  this.querySelectorAll(".pill").forEach(function(x){ x.classList.toggle("on", x===btn); });
  render();
});
document.getElementById("undoBtn").addEventListener("click", undoLast);

render();
</script>
