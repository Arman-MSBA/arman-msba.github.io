<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>Հայաստանում վերավաճառք</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Noto+Sans+Armenian:wght@600;700;800&family=IBM+Plex+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f2; --panel:#ffffff; --panel2:#eef0ea; --ink:#17201a; --muted:#5c6a60;
  --line:#dde2d8; --green:#177245; --green-bg:#e3f2e7; --red:#b3372c; --red-bg:#fbe9e6;
  --blue:#1d5fa8; --blue-bg:#e6effa; --shadow:0 1px 3px rgba(20,30,20,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121613; --panel:#1b211c; --panel2:#232a24; --ink:#e8ede8; --muted:#9fb0a2;
    --line:#2e3830; --green:#4cc07e; --green-bg:#173325; --red:#f08a7d; --red-bg:#3a201c;
    --blue:#7db3ec; --blue-bg:#1c2c42; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden;overflow-x:clip}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope","Noto Sans Armenian",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
.wrap{max-width:1080px;margin:0 auto;padding:16px 14px 24px}
.mono{font-family:"IBM Plex Mono",monospace}
h1{font-size:22px;margin:0 0 12px;font-weight:800;letter-spacing:-.01em}
.layout{display:flex;gap:16px;align-items:flex-start}
.content{flex:1;min-width:0}
.catpanel{width:190px;flex-shrink:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px;position:sticky;top:16px}
.catpanel h2{font-size:13px;font-weight:800;letter-spacing:.04em;color:var(--muted);margin:0 0 8px;text-transform:uppercase}
.catlist{display:flex;flex-direction:column;gap:4px}
.catbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:1px solid transparent;background:transparent;color:var(--ink);border-radius:9px;padding:10px 11px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;min-height:44px}
.catbtn:hover{background:var(--panel2)}
.catbtn.on{background:var(--ink);color:var(--bg)}
.catbtn .cnt{font-family:"IBM Plex Mono",monospace;font-weight:700;font-size:13px;color:var(--muted)}
.catbtn.on .cnt{color:var(--bg);opacity:.75}
@media(max-width:720px){
  .layout{flex-direction:column}
  .catpanel{width:100%;position:static}
  .catlist{flex-direction:row;flex-wrap:wrap}
  .catbtn{width:auto;flex:1 1 auto}
  .wrap{padding-bottom:24px}
}

/* Filters + sort */
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.pill{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:10px 15px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;min-height:44px}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill .cnt{font-family:"IBM Plex Mono",monospace;font-weight:700}
.sortlab{font-size:12.5px;font-weight:800;color:var(--muted);margin-left:2px}
.undobtn{margin-left:auto;width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:18px;cursor:pointer;font-family:inherit}
.undobtn:disabled{opacity:.35;cursor:default}

/* Rows */
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px}
.row.removed{opacity:.75}
.top{display:flex;align-items:flex-start;gap:12px}
.thumbwrap{position:relative;width:96px;height:96px;flex-shrink:0;border-radius:10px;border:1px solid var(--line);background:var(--panel2);overflow:hidden}
.thumbwrap svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:36px;height:36px;stroke:var(--muted);opacity:.5}
.thumbwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff;opacity:0;transition:opacity .15s}
.thumbwrap img.ok{opacity:1}
.main{flex:1;min-width:0}
.name{font-size:16px;font-weight:800;line-height:1.25;margin:0}
.prices{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:5px;font-size:13.5px;color:var(--muted);font-weight:600}
.prices .val{font-family:"IBM Plex Mono",monospace;font-weight:700;color:var(--ink)}
.prices .usd{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;color:var(--muted)}
.profit{font-family:"IBM Plex Mono",monospace;font-size:30px;font-weight:700;line-height:1;white-space:nowrap;text-align:right}
.profit.pos{color:var(--green)} .profit.neg{color:var(--red)}
.profit small{display:block;font-family:"Manrope","Noto Sans Armenian",sans-serif;font-size:11px;font-weight:700;color:var(--muted);margin-top:4px;letter-spacing:.04em}
.badge{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:800;line-height:1;padding:5px 8px;border-radius:999px;letter-spacing:.01em}
.badge.high{background:var(--green-bg);color:var(--green)}
.badge.medium{background:var(--blue-bg);color:var(--blue)}
.badge.low{background:var(--red-bg);color:var(--red)}
.badge.good{background:var(--green-bg);color:var(--green)}
.badge.maybe{background:var(--blue-bg);color:var(--blue)}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.links a{font-size:13px;font-weight:800;text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:8px 11px;color:var(--ink);background:var(--panel);min-height:38px;display:inline-flex;align-items:center}
.links a.us{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.links .nolink{font-size:13px;font-weight:700;color:var(--muted);border:1px dashed var(--line);border-radius:9px;padding:8px 11px;min-height:38px;display:inline-flex;align-items:center}
.actions{display:flex;gap:6px;align-items:stretch;margin-top:10px}
.mbtn{flex:1;min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel2);color:var(--ink);font-size:14.5px;font-weight:800;cursor:pointer;font-family:inherit;padding:8px 4px}
.mbtn:active{transform:translateY(1px)}
.mbtn.on-like{background:var(--green);border-color:var(--green);color:#fff}
.mbtn.btn-like{background:#1a7f37;border-color:#1a7f37;color:#fff}
.mbtn.btn-remove{background:#cf222e;border-color:#cf222e;color:#fff}
.mbtn.on-later{background:var(--blue);border-color:var(--blue);color:#fff}
.mbtn.on-removed{background:var(--red);border-color:var(--red);color:#fff}
@media (prefers-color-scheme: dark){.mbtn.on-like,.mbtn.on-later,.mbtn.on-removed{color:#101511}}
@media(max-width:640px){
  /* Compact mobile top: first product should appear within ~1 screen */
  .wrap{padding:8px 10px 24px}
  h1{font-size:17px;margin:0 0 6px}
  /* Category: flat single-row swipeable chip strip, no big card */
  .catpanel{width:100%;position:static;background:transparent;border:0;box-shadow:none;padding:0;margin:0 0 6px;border-radius:0}
  .catpanel h2{display:none}
  .catlist{display:flex;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;gap:6px;padding-bottom:2px}
  .catlist::-webkit-scrollbar{display:none}
  .catbtn{flex:0 0 auto;width:auto;min-width:0;min-height:34px;padding:7px 11px;font-size:12.5px;border:1px solid var(--line);background:var(--panel);border-radius:999px;white-space:nowrap}
  .catbtn .cnt{font-size:12px}
  /* Filter bars: single-row swipeable chip strips, small pills */
  .content{width:100%;min-width:0}
  .bar{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;gap:6px;align-items:center;margin-bottom:6px;padding-bottom:2px;min-width:0}
  .bar::-webkit-scrollbar{display:none}
  .pill{flex:0 0 auto;max-width:none;width:auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;padding:7px 11px;min-height:34px;white-space:nowrap}
  .sortlab{flex:0 0 auto;grid-column:auto;margin:0;font-size:12px;align-self:center}
  .undobtn{flex:0 0 auto;grid-column:auto;width:34px;height:34px;min-height:34px;margin-left:0;border-radius:999px}
  .undobtn::after{content:"";margin-left:0}
  .undobtn:disabled{display:none}
  .list{margin-top:6px;gap:5px}
  .filters{margin:0 0 6px}
  .filters select{min-height:34px}
  .sharebtn{min-height:36px;font-size:12px;padding:6px 12px}
  .cloudline{font-size:11px;line-height:1.25;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pager-top .pg{min-height:30px}
  h1{margin:0 0 4px}
  .row{min-width:0;padding:7px 10px;border-radius:10px}
  .top{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:start;flex-wrap:nowrap}
  .thumbwrap{width:96px;height:96px;border-radius:10px}
  .thumbwrap svg{width:36px;height:36px}
  .name{overflow-wrap:break-word;font-size:13px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .badge{margin-top:3px;font-size:9.5px;padding:2px 4px}
  .proofbtn{font-size:9.5px;padding:2px 5px;margin-left:3px}
  .profit{flex:none;font-size:15px;white-space:nowrap;text-align:right;min-width:0}
  .profit small{font-size:9.5px;margin-top:2px}
  .prices{margin-top:4px;font-size:11.5px;line-height:1.25;gap:2px 10px}
  .prices .usd{font-size:10.5px}
  .links{margin-top:6px;gap:5px;align-items:center}
  .links a,.links .nolink{min-height:30px;padding:4px 10px;font-size:12px;border-radius:8px}
  .actions{display:flex;gap:5px;margin-top:6px;align-items:center}
  .mbtn{flex:1;min-width:0;min-height:34px;white-space:normal;line-height:1.2;font-size:12.5px;padding:4px 2px;border-radius:8px}
}

/* Mobile filter dropdowns: hidden on desktop, shown on phones */
.filters{display:none}
@media(max-width:640px){
  .filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:0 0 8px}
  .fwrap{display:flex;flex-direction:column;gap:2px;min-width:0}
  .flab{font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.03em}
  .filters select{width:100%;min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font-size:13.5px;font-weight:700;font-family:inherit;padding:6px 8px;min-width:0}
  .filters .undobtnM{grid-column:1/-1;min-height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
  .filters .undobtnM:disabled{display:none}
  /* Chip rows replaced by dropdowns on mobile */
  .catpanel,#markPills,#demandPills,#sortPills{display:none}
}
@media(max-width:520px){
  .thumbwrap{width:96px;height:96px}
}


.empty{text-align:center;color:var(--muted);padding:32px 10px;font-size:15px}
.pager{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin:10px 0}
.pager .pg{min-width:40px;min-height:40px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;padding:6px 10px}
.pager .pg.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pager .pg:disabled{opacity:.35;cursor:default}
.pager .pgdots{color:var(--muted);font-weight:800}
.pager .pginfo{font-size:13px;font-weight:700;color:var(--muted);width:100%;text-align:center}
.pager-top{margin:0 0 4px}
.pager-top .pg{min-height:34px;font-size:13px}
.sharebtn{margin-left:6px;min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;padding:8px 14px;white-space:nowrap}
.mbtn.on-like{background:#0d5c2a;border-color:#0d5c2a;box-shadow:inset 0 0 0 2px rgba(255,255,255,.85)}
.mbtn.on-removed{background:#8f1d15;border-color:#8f1d15;box-shadow:inset 0 0 0 2px rgba(255,255,255,.85)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:92vw;text-align:center}
.toast.show{opacity:1}
.cloudline{font-size:12px;opacity:.75;margin:0 0 6px}

/* Demand proof button + modal */
.proofbtn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;margin-left:6px;vertical-align:middle}
.proofbtn:hover{background:var(--panel2);color:var(--ink)}
.modal-back{position:fixed;inset:0;background:rgba(10,15,10,.55);display:none;align-items:flex-end;justify-content:center;z-index:100;padding:0}
.modal-back.open{display:flex}
.modal{background:var(--panel);color:var(--ink);border-radius:16px 16px 0 0;max-width:560px;width:100%;max-height:86vh;overflow-y:auto;padding:18px 18px 28px;box-shadow:0 -4px 30px rgba(0,0,0,.3)}
@media(min-width:641px){.modal-back{align-items:center;padding:20px}.modal{border-radius:16px}}
.modal h3{margin:0 0 4px;font-size:18px;line-height:1.3}
.modal .mdemand{font-size:14px;font-weight:800;margin:0 0 12px}
.modal .mdemand.high{color:var(--green)}.modal .mdemand.medium{color:var(--blue)}.modal .mdemand.low{color:var(--red)}
.modal p{font-size:14.5px;line-height:1.55;margin:0 0 10px}
.modal .mlinks{margin:0 0 14px;padding:0;list-style:none}
.modal .mlinks li{margin-bottom:8px}
.modal .mlinks a{display:block;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:700;text-decoration:none;word-break:break-all}
.modal .mclose{display:block;width:100%;border:0;border-radius:999px;background:var(--ink);color:var(--bg);padding:13px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
.modal .mnone{font-size:14px;color:var(--muted);margin:0 0 14px}
.modal .mnote{font-size:13.5px;color:var(--muted);font-weight:600}
@media(max-width:640px){
  /* Compact cards, final pass: this block sits last in the stylesheet so these
     rules win over base rules defined after the earlier mobile blocks. */
  .proofbtn{font-size:9px;padding:2px 5px;line-height:1.1}
  .badge{font-size:9px;padding:2px 4px;line-height:1.1}
  .profit{font-size:14px}
  .profit small{display:none}
  .sharebtn{min-height:36px;font-size:12px;padding:6px 12px}
  .cloudline{font-size:11px;margin:0 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pager-top .pg{min-height:30px}
  .filters select{min-height:34px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="layout">
  <aside class="catpanel" aria-label="Կատեգորիաներ">
    <h2>Կատեգորիա</h2>
    <div class="catlist" id="catList"></div>
  </aside>
  <div class="content">
  <h1>Հայաստանում վերավաճառք</h1>

  <div class="filters" id="filters">
    <label class="fwrap"><span class="flab">Կատեգորիա</span><select id="selCat" aria-label="Կատեգորիա"></select></label>
    <label class="fwrap"><span class="flab">Նշում</span><select id="selMark" aria-label="Նշում"></select></label>
    <label class="fwrap"><span class="flab">Պահանջարկ</span><select id="selDemand" aria-label="Պահանջարկ"></select></label>
    <label class="fwrap"><span class="flab">Դասավորել</span><select id="selSort" aria-label="Դասավորել"><option value="profit">Շահույթ</option><option value="us">Գին</option><option value="name">Անուն</option></select></label>
    <button class="undobtnM" id="undoBtnM" type="button" disabled>↩ Հետարկել</button>
    <button class="undobtnM" id="shareBtnM" type="button">🔗 Կիսվել ընտրությամբ</button>
  </div>

  <div class="cloudline" id="cloudStatus">☁️ Ամպից բեռնում…</div>

  <div class="bar" id="markPills">
    <button class="pill on" data-markf="all" type="button">Բոլորը</button>
    <button class="pill" data-markf="like" type="button">Հավանած <span class="cnt" id="cntLike">0</span></button>
    <button class="pill" data-markf="later" type="button">Հետո <span class="cnt" id="cntLater">0</span></button>
    <button class="pill" data-markf="removed" type="button">Հեռացրած <span class="cnt" id="cntRem">0</span></button>
    <button class="undobtn" id="undoBtn" type="button" disabled aria-label="Հետարկել վերջինը" title="Հետարկել վերջինը">↩</button>
    <button class="sharebtn" id="shareBtn" type="button" title="Կիսվել ընտրությամբ">🔗 Կիսվել</button>
  </div>

  <div class="bar" id="demandPills">
    <span class="sortlab">Պահանջարկ՝</span>
    <button class="pill on" data-demand="all" type="button">Բոլորը</button>
    <button class="pill" data-demand="high" type="button">Բարձր <span class="cnt" id="cntHigh">0</span></button>
    <button class="pill" data-demand="medium" type="button">Միջին <span class="cnt" id="cntMed">0</span></button>
    <button class="pill" data-demand="low" type="button">Ցածր <span class="cnt" id="cntLow">0</span></button>
  </div>

  <div class="bar" id="sortPills">
    <span class="sortlab">Դասավորել՝</span>
    <button class="pill on" data-sort="profit" type="button">Շահույթ</button>
    <button class="pill" data-sort="us" type="button">Գին</button>
    <button class="pill" data-sort="name" type="button">Անուն</button>
  </div>

  <div class="pager pager-top" id="pagerTop"></div>
  <div class="list" id="list"></div>
  <div class="pager" id="pager"></div>
  </div>
  </div>
</div>

<div class="toast" id="toast"></div>


<div class="modal-back" id="proofBack" role="dialog" aria-modal="true" aria-labelledby="proofTitle">
  <div class="modal" id="proofModal"></div>
</div>
<script>
var SHEET = "https://docs.google.com/spreadsheets/d/1TXrnkSOg5wRnvJecEKQ6MD2VIrVA-e2rpPNud3tMlbQ/edit";
var RATE = 363, TAX = 1.0625;

var CATS = {electronics:"Էլեկտրոնիկա", beauty:"Կոսմետիկա", vitamins:"Վիտամիններ", kitchen:"Խոհանոց", sport:"Սպորտ", baby:"Մանկական"};

var MARKS_KEY = "armenia-resale-marks-v1";
function loadMarks(){
  try{
    var raw = localStorage.getItem(MARKS_KEY);
    if(!raw) return {};
    var obj = JSON.parse(raw);
    if(!obj || typeof obj !== "object") return {};
    var out = {};
    PRODUCTS.forEach(function(p){
      var v = obj[p.id];
      if(v === "like" || v === "later" || v === "removed") out[p.id] = v;
    });
    return out;
  }catch(e){ return {}; }
}
function saveMarks(){
  try{ localStorage.setItem(MARKS_KEY, JSON.stringify(marks)); }catch(e){}
  syncHash();
}
function encodeMarks(){
  var parts=[];
  ["like","later","removed"].forEach(function(m){
    var ids=Object.keys(marks).filter(function(id){ return marks[id]===m; });
    if(ids.length) parts.push(m+":"+ids.join(","));
  });
  return parts.length ? "#m="+parts.join(";") : "";
}
function decodeMarksHash(){
  try{
    var h=(location.hash||"").replace(/^#/,"");
    var m=h.match(/(?:^|&)m=([^&]*)/); if(!m) return {};
    var out={};
    decodeURIComponent(m[1]).split(";").forEach(function(seg){
      var kv=seg.split(":");
      if(kv.length!==2) return;
      if(kv[0]!=="like"&&kv[0]!=="later"&&kv[0]!=="removed") return;
      kv[1].split(",").forEach(function(id){ if(id) out[id]=kv[0]; });
    });
    return out;
  }catch(e){ return {}; }
}
function syncHash(){
  try{
    var h=encodeMarks();
    history.replaceState(null,"",location.pathname+location.search+h);
  }catch(e){}
}
var marks = loadMarks();
(function(){

  });
  if(changed) saveMarks(); else syncHash();
})();

  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  var out=[];
  rows.forEach(function(r, idx){
    if(idx===0) return;
    if(!r[0]) return;
    out.push({product_id:(r[0]||"").trim(), mark:(r[1]||"").trim(), quantity:(r[2]||"").trim(), updated_by:(r[3]||"").trim(), updated_at:(r[4]||"").trim()});
  });
  return out;
}
function applyCloud(rows){
  var changed=false;
  rows.forEach(function(r){
    if(!PRODUCTS.some(function(p){ return p.id===r.product_id; })) return;
    if(r.mark==="like"||r.mark==="later"||r.mark==="removed"){
      if(marks[r.product_id]!==r.mark){ marks[r.product_id]=r.mark; changed=true; }
    }
  });
  return changed;
}
function loadCloud(){
  setCloudStatus("☁️ Ամպից բեռնում…");
  fetch(CLOUD_CSV_URL+"&_="+Date.now(), {cache:"no-store"}).then(function(res){
    if(!res.ok) throw new Error("http "+res.status);
    return res.text();
  }).then(function(text){
    var rows=parseCloudCSV(text);
    var changed=applyCloud(rows);
    cloudLoaded=true;
    if(changed){ saveMarks(); }
    setCloudStatus(rows.length ? "☁️ Ընդհանուր ընտրությունը բեռնված է" : "☁️ Ընդհանուր ցանկը դեռ դատարկ է");
    render();
  }).catch(function(){
    setCloudStatus("☁️ Ամպը հասանելի չէ, ցույց է տրվում այս հեռախոսի ընտրությունը");
  });
}
function saveCloud(id){
  if(!CLOUD_FORM_URL || !CLOUD_FORM_ENTRIES.product_id) return;
  try{
    var fd=new FormData();
    fd.append("entry."+CLOUD_FORM_ENTRIES.product_id, id);
    fd.append("entry."+CLOUD_FORM_ENTRIES.mark, marks[id]||"");
    fd.append("entry."+CLOUD_FORM_ENTRIES.updated_by, "web");
    fd.append("entry."+CLOUD_FORM_ENTRIES.updated_at, new Date().toISOString());
    fetch(CLOUD_FORM_URL, {method:"POST", mode:"no-cors", body:fd}).catch(function(){});
  }catch(e){}
}
var undoStack = [];

var PAGE_SIZE = 20;
var state = {sort:"profit", markf:"all", cat:"all", demand:"all", page:1};

function taxPrice(p){ return p.usPrice*TAX; }
function armUSD(p){ return p.armAMD/RATE; }
function profit(p){ return armUSD(p)-taxPrice(p); }
function money(n){ var s = n<0?"-$":"$"; return s + Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function money0(n){ var s = n<0?"-$":"$"; return s + Math.abs(Math.round(n)).toLocaleString("en-US"); }
function amd(n){ return n.toLocaleString("en-US")+" դրամ"; }
function usAMD(p){ return Math.round(Math.round(taxPrice(p)*100)/100*RATE); }
function profitAMD(p){ return (typeof p.profitAMD==="number") ? p.profitAMD : Math.round(profit(p))*RATE; }
function amd0(n){ var s = n<0?"-":""; return s + Math.abs(Math.round(n)).toLocaleString("en-US")+" դրամ"; }

var toastTimer = null;
function showToast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1600);
}
function syncUndoBtn(){ var d = !undoStack.length; document.getElementById("undoBtn").disabled = d; var m = document.getElementById("undoBtnM"); if(m) m.disabled = d; }
function buildSelects(){
  var catCounts = {};
  PRODUCTS.forEach(function(p){ catCounts[p.cat] = (catCounts[p.cat]||0)+1; });
  var catKeys = Object.keys(CATS).filter(function(k){ return catCounts[k]; });
  var sel = document.getElementById("selCat");
  if(sel){
    var ch = '<option value="all">\u0532\u0578\u056c\u0578\u0580\u0568 ('+PRODUCTS.length+')</option>';
    catKeys.forEach(function(k){ ch += '<option value="'+k+'">'+(CATS[k]||k)+' ('+catCounts[k]+')</option>'; });
    sel.innerHTML = ch; sel.value = state.cat;
  }
  var cLike=0, cLater=0, cRem=0, cHigh=0, cMed=0, cLow=0;
  PRODUCTS.forEach(function(p){
    var m = marks[p.id];
    if(m==="like") cLike++; else if(m==="later") cLater++; else if(m==="removed") cRem++;
    if(p.demand==="high") cHigh++; else if(p.demand==="medium") cMed++; else if(p.demand==="low") cLow++;
  });
  var sm = document.getElementById("selMark");
  if(sm){ sm.innerHTML = '<option value="all">\u0532\u0578\u056c\u0578\u0580\u0568</option><option value="like">\u0540\u0561\u057e\u0561\u0576\u0561\u056e ('+cLike+')</option><option value="later">\u0540\u0565\u057f\u0578 ('+cLater+')</option><option value="removed">\u0540\u0565\u057c\u0561\u0581\u0580\u0561\u056e ('+cRem+')</option>'; sm.value = state.markf; }
  var sd = document.getElementById("selDemand");
  if(sd){ sd.innerHTML = '<option value="all">\u0532\u0578\u056c\u0578\u0580\u0568</option><option value="high">\u0532\u0561\u0580\u0571\u0580 ('+cHigh+')</option><option value="medium">\u0544\u056b\u057b\u056b\u0576 ('+cMed+')</option><option value="low">\u0551\u0561\u056e\u0580 ('+cLow+')</option>'; sd.value = state.demand; }
  var ss = document.getElementById("selSort");
  if(ss) ss.value = state.sort;
}
function setMark(id, m){
  var cur = marks[id] || null;
  undoStack.push({id:id, prev:cur});
  if(cur === m) delete marks[id]; else marks[id] = m;
  saveMarks();
  saveCloud(id);
  syncUndoBtn();
  showToast("Պահպանված է");
  render();
}
function undoLast(){
  var last = undoStack.pop();
  if(!last) return;
  if(last.prev) marks[last.id] = last.prev; else delete marks[last.id];
  saveMarks();
  syncUndoBtn();
  showToast("Պահպանված է");
  render();
}

function emptyMsg(){
  if(state.demand!=="all") return "Այդ պահանջարկով ապրանք չկա։";
  if(state.markf==="like") return "Դեռ ոչինչ չեք հավանել։";
  if(state.markf==="later") return "«Հետո» նշվածներ չկան։";
  if(state.markf==="removed") return "Հեռացրածներ չկան։";
  return "Դատարկ է։";
}

function render(){
  buildSelects();
  var cLike=0, cLater=0, cRem=0;
  PRODUCTS.forEach(function(p){
    var m = marks[p.id];
    if(m==="like") cLike++; else if(m==="later") cLater++; else if(m==="removed") cRem++;
  });
  document.getElementById("cntLike").textContent = cLike;
  document.getElementById("cntLater").textContent = cLater;
  document.getElementById("cntRem").textContent = cRem;
  var cHigh=0, cMed=0, cLow=0;
  PRODUCTS.forEach(function(p){ if(p.demand==="high") cHigh++; else if(p.demand==="medium") cMed++; else if(p.demand==="low") cLow++; });
  document.getElementById("cntHigh").textContent = cHigh;
  document.getElementById("cntMed").textContent = cMed;
  document.getElementById("cntLow").textContent = cLow;

  var catCounts = {};
  PRODUCTS.forEach(function(p){ catCounts[p.cat] = (catCounts[p.cat]||0)+1; });
  var catKeys = Object.keys(CATS).filter(function(k){ return catCounts[k]; });
  PRODUCTS.forEach(function(p){ if(catKeys.indexOf(p.cat)<0 && catCounts[p.cat]) catKeys.push(p.cat); });
  var catHtml = '<button type="button" class="catbtn'+(state.cat==="all"?" on":"")+'" data-cat="all"><span>Բոլորը</span><span class="cnt">'+PRODUCTS.length+'</span></button>';
  catKeys.forEach(function(k){
    catHtml += '<button type="button" class="catbtn'+(state.cat===k?" on":"")+'" data-cat="'+k+'"><span>'+(CATS[k]||k)+'</span><span class="cnt">'+catCounts[k]+'</span></button>';
  });
  document.getElementById("catList").innerHTML = catHtml;
  document.querySelectorAll("[data-cat]").forEach(function(b){ b.addEventListener("click", function(){ state.cat = b.getAttribute("data-cat"); state.page=1; render(); }); });

  var list = PRODUCTS.filter(function(p){
    if(state.cat!=="all" && p.cat!==state.cat) return false;
    if(state.demand!=="all" && p.demand!==state.demand) return false;
    var mk = marks[p.id] || null;
    if(state.markf==="all"){ if(mk==="removed") return false; }
    else if(mk!==state.markf) return false;
    return true;
  });
  list.sort(function(a,b){
    if(state.sort==="profit") return profit(b)-profit(a);
    if(state.sort==="us") return taxPrice(a)-taxPrice(b);
    return a.name.localeCompare(b.name);
  });
  var totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if(state.page>totalPages) state.page=1;
  if(state.page<1) state.page=1;
  var startIdx=(state.page-1)*PAGE_SIZE;
  var pageItems=list.slice(startIdx, startIdx+PAGE_SIZE);

  var html = "";
  if(!list.length){ html = '<div class="empty">'+emptyMsg()+'</div>'; }
  pageItems.forEach(function(p){
    var pr = profit(p), tp = taxPrice(p), prA = profitAMD(p);
    var mk = marks[p.id] || null;
    var usBtn = p.usLink ? '<a class="us" href="'+p.usLink+'" target="_blank" rel="noopener">ԱՄՆ ↗</a>' : '<span class="nolink">Հղում չկա</span>';
    var armBtn = p.armLink ? '<a href="'+p.armLink+'" target="_blank" rel="noopener">Հայաստան ↗</a>' : '<span class="nolink">Հղում չկա</span>';
    var imgFile = IMG[p.id];
    var thumbHtml = '<span class="thumbwrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-9 9"/></svg>'
      + (imgFile ? '<img class="thumb" src="assets/'+imgFile+'" alt="" loading="lazy">' : '')
      + '</span>';
    html += '<article class="row'+(mk==="removed"?' removed':'')+'">'
      + '<div class="top">'+thumbHtml+'<div class="main">'
      + '<h2 class="name">'+p.name+'</h2>'
      + '<span class="badge '+p.demand+'">'+DEMAND[p.demand]+'</span>' + ' <button type="button" class="proofbtn" data-proof="'+p.id+'">Ապացույց</button>'
      + (p.status ? ' <span class="badge '+(STATUS_CLASS[p.status]||'')+'">'+p.status+'</span>' : '')
      + '</div>'
      + '<div class="profit '+(pr>=0?'pos':'neg')+'">'+amd0(prA)+'<small>ՇԱՀՈՒՅԹ · '+((typeof p.profitAMD==="number")?money(pr):money0(pr))+'</small></div>'
      + '</div>'
      + '<div class="prices"><span>ԱՄՆ հարկով՝ <span class="val">'+amd(usAMD(p))+'</span> <span class="usd">'+money(tp)+'</span></span><span>Հայաստան՝ <span class="val">'+amd(p.armAMD)+'</span> <span class="usd">'+money(armUSD(p))+'</span></span></div>'
      + '<div class="links">'+usBtn+armBtn+'</div>'
      + '<div class="actions">'
      + '<button type="button" class="mbtn btn-like'+(mk==="like"?" on-like":"")+'" data-mark="like" data-id="'+p.id+'">'+(mk==="like"?"✓ Հավանված":"Հավանել")+'</button>'
      + '<button type="button" class="mbtn'+(mk==="later"?" on-later":"")+'" data-mark="later" data-id="'+p.id+'">'+(mk==="later"?"✓ Հետո":"Հետո")+'</button>'
      + '<button type="button" class="mbtn btn-remove'+(mk==="removed"?" on-removed":"")+'" data-mark="removed" data-id="'+p.id+'">'+(mk==="removed"?"✕ Հեռացված":"Հեռացնել")+'</button>'
      + '</div></article>';
  });
  document.getElementById("list").innerHTML = html;
  document.querySelectorAll("img.thumb").forEach(function(im){
    function show(){ im.classList.add("ok"); }
    function fail(){ if(im.parentNode) im.parentNode.removeChild(im); }
    if(im.complete){ if(im.naturalWidth>0) show(); else fail(); }
    else { im.addEventListener("load", show); im.addEventListener("error", fail); }
  });
  document.querySelectorAll("[data-mark]").forEach(function(b){ b.addEventListener("click", function(){ setMark(b.getAttribute("data-id"), b.getAttribute("data-mark")); }); });
  document.querySelectorAll("[data-proof]").forEach(function(b){ b.addEventListener("click", function(){ openProof(b.getAttribute("data-proof")); }); });
  renderPager(totalPages, list.length, startIdx);
}

function pagerHtml(totalPages){
  var p=state.page, out='<button type="button" class="pg" data-page="prev"'+(p<=1?' disabled':'')+'>‹ Նախորդ</button>';
  var win=[]; for(var i=1;i<=totalPages;i++){ if(i===1||i===totalPages||Math.abs(i-p)<=1) win.push(i); }
  var prevN=0;
  win.forEach(function(n){
    if(prevN&&n-prevN>1) out+='<span class="pgdots">…</span>';
    out+='<button type="button" class="pg'+(n===p?' on':'')+'" data-page="'+n+'">'+n+'</button>';
    prevN=n;
  });
  out+='<button type="button" class="pg" data-page="next"'+(p>=totalPages?' disabled':'')+'>Հաջորդ ›</button>';
  return out;
}
function renderPager(totalPages, total, startIdx){
  var top=document.getElementById("pagerTop"), bot=document.getElementById("pager");
  if(!top||!bot) return;
  if(total<=PAGE_SIZE){ top.innerHTML=""; bot.innerHTML=""; return; }
  top.innerHTML='<button type="button" class="pg" data-page="prev"'+(state.page<=1?' disabled':'')+'>‹ Նախ</button><span class="pginfo" style="width:auto">Էջ '+state.page+' / '+totalPages+'</span><button type="button" class="pg" data-page="next"'+(state.page>=totalPages?' disabled':'')+'>Հաջ ›</button>';
  bot.innerHTML=pagerHtml(totalPages)+'<span class="pginfo">Էջ '+state.page+' / '+totalPages+' · '+total+' ապրանքից '+(startIdx+1)+'–'+Math.min(startIdx+PAGE_SIZE,total)+'</span>';
  document.querySelectorAll("[data-page]").forEach(function(b){ b.addEventListener("click", function(){
    var v=b.getAttribute("data-page");
    if(v==="prev") state.page=Math.max(1,state.page-1);
    else if(v==="next") state.page=Math.min(totalPages,state.page+1);
    else state.page=parseInt(v,10)||1;
    render();
    var l=document.getElementById("list"); if(l) l.scrollIntoView({block:"start"});
  }); });
}
function fallbackCopy(text){
  try{
    var ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
  }catch(e){ window.prompt("Պատճենեք հղումը՝", text); }
}
function shareMarks(){
  syncHash();
  var url=location.href;
  function done(){ showToast("Հղումը պատճենված է ✓"); }
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done, function(){ fallbackCopy(url); done(); }); }
  else { fallbackCopy(url); done(); }
}


document.getElementById("markPills").addEventListener("click", function(e){
  var btn = e.target.closest ? e.target.closest("button") : null;
  if(!btn) return;
  state.markf = btn.getAttribute("data-markf"); state.page=1;
  this.querySelectorAll(".pill").forEach(function(x){ x.classList.toggle("on", x===btn); });
  render();
});
document.getElementById("sortPills").addEventListener("click", function(e){
  var btn = e.target.closest ? e.target.closest("button") : null;
  if(!btn) return;
  state.sort = btn.getAttribute("data-sort"); state.page=1;
  this.querySelectorAll(".pill").forEach(function(x){ x.classList.toggle("on", x===btn); });
  render();
});
document.getElementById("demandPills").addEventListener("click", function(e){
  var btn = e.target.closest ? e.target.closest("button") : null;
  if(!btn) return;
  state.demand = btn.getAttribute("data-demand"); state.page=1;
  this.querySelectorAll(".pill").forEach(function(x){ x.classList.toggle("on", x===btn); });
  render();
});
document.getElementById("undoBtn").addEventListener("click", undoLast);
document.getElementById("undoBtnM").addEventListener("click", undoLast);
document.getElementById("selCat").addEventListener("change", function(){ state.cat = this.value; state.page=1; render(); });
document.getElementById("selMark").addEventListener("change", function(){ state.markf = this.value; state.page=1; render(); });
document.getElementById("selDemand").addEventListener("change", function(){ state.demand = this.value; state.page=1; render(); });
document.getElementById("selSort").addEventListener("change", function(){ state.sort = this.value; state.page=1; render(); });
document.getElementById("shareBtn").addEventListener("click", shareMarks);
document.getElementById("shareBtnM").addEventListener("click", shareMarks);


function escHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function openProof(id){
  var p = null; PRODUCTS.forEach(function(x){ if(x.id===id) p=x; });
  var pr = PROOFS[id]; if(!p || !pr) return;
  var html = '<h3 id="proofTitle">'+escHtml(p.name)+'</h3>'
    + '<p class="mdemand '+p.demand+'">Պահանջարկ՝ '+DEMAND[p.demand]+'</p>'
    + pr.t.split("\n\n").map(function(par){ return '<p>'+escHtml(par)+'</p>'; }).join('')
    + (p.note ? '<p class="mnote">Նշում՝ '+escHtml(p.note)+'</p>' : '')
    + (pr.l.length ? '<ul class="mlinks">' + pr.l.map(function(lk){ return '<li><a href="'+escHtml(lk[1])+'" target="_blank" rel="noopener">'+escHtml(lk[0])+' ↗</a></li>'; }).join('') + '</ul>'
                   : '<p class="mnone">Առանձին ապացույցի հղում չկա։ Այս ապրանքի Հայաստանի գինը դեռ չի հաստատվել։</p>')
    + '<button type="button" class="mclose" id="proofClose">Փակել</button>';
  document.getElementById("proofModal").innerHTML = html;
  document.getElementById("proofBack").classList.add("open");
  document.getElementById("proofClose").addEventListener("click", closeProof);
}
function closeProof(){ document.getElementById("proofBack").classList.remove("open"); }
document.getElementById("proofBack").addEventListener("click", function(e){ if(e.target===this) closeProof(); });
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeProof(); });

render();
loadCloud();
</script>
